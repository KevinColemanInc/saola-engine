{% extends "base.html" %}

{% block title %}Preview Pull Request{% endblock %}

{% block content %}
<section class="confirmation">
  <p class="eyebrow">{{ repository }}</p>
  <h1>Ready to prepare a pull request</h1>
  <p>{{ regulation.title }}</p>
  <form method="post" action="/regulations/{{ regulation.id }}/fix/jobs">
    <input type="hidden" name="repository" value="{{ repository }}">
    <button class="button" type="submit">Preview Pull Request</button>
  </form>
</section>
{% endblock %}
